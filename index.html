<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperMarket Express</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f7ef;
    }

    .contenedor {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .banner {
      position: relative;
      width: 100%;
      max-width: 1100px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .banner img {
      display: block;
      width: 100%;
      height: auto;
    }

    .boton {
      position: absolute;
      left: 8%;
      bottom: 9%;
      background: #ffd719;
      color: #174d27;
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .boton:hover {
      background: #ffdf4d;
      transform: scale(1.05);
    }

    .mensaje {
      display: none;
      text-align: center;
      background: #174d27;
      color: white;
      padding: 15px;
      font-weight: bold;
    }

    .mensaje.mostrar {
      display: block;
    }

    @media (max-width: 600px) {
      .contenedor {
        padding: 10px;
      }

      .boton {
        padding: 8px 15px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="banner">

      <!-- Imagen del supermercado -->
      <img src="656893de-13ae-4390-9aad-f9c41ba22001.png"
           alt="SuperMarket Express">

      <!-- Botón -->
      <button class="boton" onclick="comprar()">
        🛒 COMPRAR AHORA
      </button>

      <!-- Mensaje -->
      <div id="mensaje" class="mensaje">
        ✅ ¡Tu compra ha comenzado correctamente!
      </div>

    </div>

  </div>

  <script>
    function comprar() {
      const mensaje = document.getElementById("mensaje");

      mensaje.classList.add("mostrar");

      setTimeout(function() {
        mensaje.classList.remove("mostrar");
      }, 3000);
    }
  </script>

</body>
</html>
